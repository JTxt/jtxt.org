<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>404 — Page Not Found | jtxt.org</title>
	<meta name="description" content="That page doesn't exist on jtxt.org. Head to the homepage to find what you're looking for.">
	<meta name="robots" content="noindex">

	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
			display: flex;
			justify-content: center;
			align-items: center;
			min-height: 100vh;
			background: #121212;
		}
		h1 {
			font-size: 2.5rem;
			font-weight: 400;
			color: #eaeaea;
			letter-spacing: 0.5px;
			margin-bottom: 1rem;
		}
		h2 {
			font-size: 1.5rem;
			font-weight: 400;
			color: #cfcfcf;
			margin-bottom: 0.5rem;
		}
		h3 {
			font-size: 1.1rem;
			font-weight: 400;
			color: #a0a0a0;
			margin-bottom: 2rem;
		}
		.content {
			text-align: center;
			max-width: 600px;
			padding: 2rem;
		}
		a {
			color: #4da3ff;
			text-decoration: none;
		}
		a:hover {
			text-decoration: underline;
		}
		.home-link {
			display: inline-block;
			font-size: 1.8rem;
			line-height: 1.4;
		}
	</style>
</head>
<body>
	<div class="content">
		<h1>404 - page not found</h1>
		<h2>this page doesn't exist</h2>
		<h3>it may have moved, or the link may be wrong</h3>
		<a class="home-link" href="https://jtxt.org/">go to jtxt.org, to find what you're looking for</a>
	</div>
</body>
</html>
